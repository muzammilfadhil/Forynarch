name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Portable unit tests (native tests may skip)
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check keyboard bindings
        run: python scripts/hotkeys.py --check
      - name: Bash syntax
        if: runner.os == 'Linux'
        run: |
          for script in scripts/*.sh; do bash -n "$script" || exit; done
