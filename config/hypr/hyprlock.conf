# Forynarch artwork and restrained blue highlights match the SDDM login theme.
general {
    hide_cursor = true
    ignore_empty_input = true
}
background {
    monitor =
    path = /usr/share/sddm/themes/forynarch-kath/Backgrounds/forynarch-navy.png
    color = rgba(101c30ff)
    blur_passes = 1
    blur_size = 5
    brightness = 0.55
}
image {
    monitor =
    path = /usr/share/forynarch/branding/logo.png
    size = 64
    border_size = 0
    position = 0, 220
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgba(e4efffff)
    font_size = 52
    font_family = Adwaita Sans
    position = 0, 130
    halign = center
    valign = center
}
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(b5c9e3ff)
    font_size = 15
    font_family = Adwaita Sans
    position = 0, 56
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    outer_color = rgba(76c0ecdd) rgba(425b9aaa) 45deg
    inner_color = rgba(101c30df)
    font_color = rgba(e4efffff)
    placeholder_text = Password
    fail_color = rgba(f2b49bff)
    check_color = rgba(76c0ecff)
    fail_text = Try again
    fade_on_empty = false
    rounding = 12
    position = 0, -24
    halign = center
    valign = center
}
label {
    monitor =
    text = FORYNARCH
    color = rgba(91aac8ff)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = bottom
}
